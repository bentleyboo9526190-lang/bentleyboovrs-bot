name: BentleyBooVR checks

on:
  push:
    paths:
      - "bentleyboovr/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "bentleyboovr/**"
      - "tests/**"
      - ".github/workflows/tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bentleyboovr/requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q
